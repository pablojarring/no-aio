name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Manifest al día
        run: npm run build && git diff --exit-code manifest.json
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: no-aio-extension
          path: no-aio.zip
